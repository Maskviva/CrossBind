[package]
name = "crossbind-mod"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "LeviLamina Rust mod: lets Bedrock clients join servers on a different protocol version"

[lib]
name = "crossbind"
crate-type = ["cdylib"]

[dependencies]
bedrock-codec = { path = "../bedrock-codec" }
bedrock-protocol = { path = "../bedrock-protocol" }
levilamina = { path = "../../../levilamina-rust-loader/crates/levilamina", default-features = false, features = ["server"] }
