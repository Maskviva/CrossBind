[package]
name = "crossbind-mod"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Pier mod: lets Bedrock clients join servers on a different protocol version"

[lib]
name = "crossbind"
crate-type = ["cdylib"]

[dependencies]
bedrock-codec = { path = "../bedrock-codec" }
bedrock-protocol = { path = "../bedrock-protocol" }
pier-rs = { git = "https://github.com/Maskviva/pier", tag = "26.20.1" }

[features]
default = []
client = ["pier-rs/client"]
